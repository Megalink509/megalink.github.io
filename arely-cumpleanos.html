<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Arely 💙</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Georgia', serif;
}

/* ── CANVAS ── */
canvas#bg {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── SURPRISE SCREEN ── */
#surprise-screen {
  position: fixed; inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 1.2s ease, transform 1.2s ease;
}
#surprise-screen.hide {
  opacity: 0;
  transform: scale(1.08);
  pointer-events: none;
}
.surprise-glow {
  position: absolute;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(80,120,255,0.18) 0%, rgba(160,60,255,0.08) 50%, transparent 80%);
  animation: pulse-bg 3s ease-in-out infinite alternate;
}
@keyframes pulse-bg {
  from { transform: scale(0.9); opacity: 0.6; }
  to   { transform: scale(1.15); opacity: 1; }
}
.surprise-emoji {
  font-size: 3.2rem;
  margin-bottom: 20px;
  animation: bounce 2s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 16px rgba(160,60,255,0.7));
  position: relative; z-index: 1;
}
@keyframes bounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-12px); }
}
#btn-surprise {
  position: relative; z-index: 1;
  padding: 18px 42px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #4a20cc, #8b2fff, #c040ff, #4a20cc);
  background-size: 200% 200%;
  animation: grad-move 3s ease infinite;
  color: #fff;
  font-family: 'Georgia', serif;
  font-style: italic;
  font-size: clamp(1rem, 4vw, 1.25rem);
  cursor: pointer;
  box-shadow:
    0 0 20px rgba(140,47,255,0.7),
    0 0 50px rgba(140,47,255,0.35),
    inset 0 1px 0 rgba(255,255,255,0.2);
  letter-spacing: 0.04em;
  transition: transform 0.15s, box-shadow 0.15s;
}
#btn-surprise:hover {
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(180,80,255,0.9), 0 0 70px rgba(140,47,255,0.5);
}
#btn-surprise:active { transform: scale(0.97); }
@keyframes grad-move {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.hint {
  position: relative; z-index: 1;
  margin-top: 18px;
  font-size: 0.78rem;
  color: rgba(200,170,255,0.5);
  letter-spacing: 0.2em;
  font-style: italic;
  animation: fadeHint 2s 1.5s ease both;
}
@keyframes fadeHint {
  from { opacity:0; }
  to   { opacity:1; }
}

/* ── MAIN CONTENT ── */
#main {
  position: relative;
  z-index: 10;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.4s 0.4s ease;
  pointer-events: none;
}
#main.show {
  opacity: 1;
  pointer-events: auto;
}

/* QUOTE */
.quote {
  text-align: center;
  padding: 0 24px;
  margin-bottom: 28px;
  animation: none;
}
.quote p {
  font-style: italic;
  font-size: clamp(1rem, 3.8vw, 1.3rem);
  line-height: 1.65;
  color: #c0e8ff;
  text-shadow: 0 0 14px #00cfff, 0 0 35px #0099ff, 0 0 70px rgba(0,180,255,0.3);
}
.heart {
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.28); }
}

/* BOUQUET */
.bouquet-wrap {
  animation: floatUp 4s ease-in-out infinite alternate;
}
@keyframes floatUp {
  from { transform: translateY(0); }
  to   { transform: translateY(-14px); }
}

/* TAGLINE */
.tagline {
  margin-top: 22px;
  font-style: italic;
  font-size: clamp(0.72rem, 2.4vw, 0.9rem);
  color: rgba(190,160,255,0.55);
  letter-spacing: 0.2em;
  text-shadow: 0 0 12px rgba(160,80,255,0.3);
}

/* PARTICLES */
.particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  animation: floatP var(--fd,8s) var(--fd-d,0s) ease-in infinite;
  opacity: 0;
}
@keyframes floatP {
  0%   { opacity:0; transform:translateY(0) scale(0.5); }
  15%  { opacity:0.85; }
  85%  { opacity:0.45; }
  100% { opacity:0; transform:translateY(-78vh) scale(1.3); }
}
</style>
</head>

<script>
// ── CANVAS: stars + shooting stars ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

// Static stars
const STARS = Array.from({length:220}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*1.6+0.3,
  op: Math.random()*0.55+0.15,
  phase: Math.random()*Math.PI*2,
  speed: Math.random()*0.007+0.003,
  hue: Math.random() < 0.4 ? 270 : 200   // purple or blue tint
}));

// Shooting stars pool
const SHOOTERS = [];
function spawnShooter() {
  const angle = (Math.random()*30 + 20) * Math.PI/180; // 20-50 deg down-right
  const speed = Math.random()*6 + 5;
  SHOOTERS.push({
    x: Math.random()*innerWidth,
    y: Math.random()*(innerHeight*0.55),
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    len: Math.random()*140+80,
    alpha: 1,
    fade: Math.random()*0.012+0.008,
    hue: Math.random() < 0.5 ? 260 : 200,
    width: Math.random()*1.5+0.6
  });
}
// spawn periodically
setInterval(spawnShooter, 900);
spawnShooter(); spawnShooter();

function draw(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // stars
  STARS.forEach(s => {
    const op = s.op * (0.5 + 0.5*Math.sin(t*s.speed+s.phase));
    ctx.beginPath();
    ctx.arc(s.x*canvas.width, s.y*canvas.height, s.r, 0, Math.PI*2);
    ctx.fillStyle = s.hue === 270
      ? `rgba(210,170,255,${op})`
      : `rgba(170,220,255,${op})`;
    ctx.fill();
  });

  // shooting stars
  for (let i = SHOOTERS.length-1; i >= 0; i--) {
    const s = SHOOTERS[i];
    const col = s.hue === 260 ? [180,100,255] : [100,200,255];
    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx/s.speed*s.len*0.14, s.y - s.vy/s.speed*s.len*0.14);
    grad.addColorStop(0, `rgba(${col},${s.alpha})`);
    grad.addColorStop(1, `rgba(${col},0)`);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    const tailFactor = s.len / Math.sqrt(s.vx*s.vx+s.vy*s.vy);
    ctx.lineTo(s.x - s.vx*tailFactor*0.14, s.y - s.vy*tailFactor*0.14);
    ctx.strokeStyle = grad;
    ctx.lineWidth = s.width;
    ctx.stroke();
    // move
    s.x += s.vx; s.y += s.vy;
    s.alpha -= s.fade;
    if (s.alpha <= 0 || s.x > canvas.width+100 || s.y > canvas.height+100) {
      SHOOTERS.splice(i,1);
    }
  }
  requestAnimationFrame(draw);
}
draw(0);

// ── REVEAL ──
function reveal() {
  document.getElementById('surprise-screen').classList.add('hide');
  document.getElementById('main').classList.add('show');
  spawnParticles();
  // burst of shooters
  for(let i=0;i<5;i++) setTimeout(spawnShooter, i*180);
}

function spawnParticles() {
  const colors = ['#80aaff','#c080ff','#ffffff','#a0d8ff','#e0b0ff','#60c0ff'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*4+2;
    const col = colors[Math.floor(Math.random()*colors.length)];
    p.style.cssText = `
      width:${size}px;height:${size}px;
      background:${col};
      box-shadow:0 0 ${size*2}px ${col};
      left:${Math.random()*100}%;
      bottom:${5+Math.random()*35}%;
      --fd:${(Math.random()*5+6).toFixed(1)}s;
      --fd-d:${(Math.random()*6).toFixed(1)}s;
    `;
    document.body.appendChild(p);
  }
}
</script>
</body>
